  .card-inner{position:relative;width:100%;aspect-ratio:3/5;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.7,.25,1)}

  .card-face{position:absolute;inset:0;border-radius:9px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;

  .card-back{background:
    radial-gradient(circle at center,rgba(224,220,204,.88) 0 5%,transparent 5.5%),

    linear-gradient(145deg,#142c45,#091a2d 72%)}
  .card-back::before{content:"";position:absolute;inset:10px;border:1px solid rgba(188,167,124,.38);border-radius:5px}
  .card-back::after{content:"水镜";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:18px;letter-spacing:.48em;text-indent:.48em;color:rgba(238,233,220,.72)}
  .card-front{transform:rotateY(180deg);background:linear-gradient(160deg,#13253e,#0c1930 60%,#091526)}
  .front-rotator{position:absolute;inset:0}
  .front-rotator.reversed{transform:rotate(180deg)}
  .card-front img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .8s ease}
  .card-front.fallback img{opacity:0}
  .facsimile{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#13253e,#0c1930 60%,#091526)}
  .card-front.fallback .facsimile{display:flex}
  .facsimile .disc{width:47px;height:47px;border-radius:50%;background:radial-gradient(circle at 40% 36%,#efeada,#c8c0a8);opacity:.86}
  .facsimile .nm{font-family:var(--serif);letter-spacing:.38em;text-indent:.38em;color:var(--moon);font-size:16px}
  .cardwrap::after{content:"";display:block;margin:10px auto 0;width:86%;height:80px;border-radius:45%;opacity:0;transform:scaleY(-1);filter:blur(8px);
    background:linear-gradient(180deg,rgba(154,188,200,.22),rgba(154,188,200,.05) 30%,transparent 72%);transition:opacity 1.1s .4s}
  .cardwrap.risen::after{opacity:.40}
  .card-label{min-height:28px;margin-top:-49px;font-family:var(--serif);font-size:12px;letter-spacing:.28em;text-indent:.28em;color:var(--reed);text-shadow:0 0 10px rgba(7,17,31,.5);opacity:0;transition:opacity .7s}
  .cardwrap.flipped .card-label{opacity:.86}

  #panel{position:relative;width:min(510px,94vw);max-height:0;overflow:hidden;margin:0 auto;padding:0 26px;opacity:0;transform:translateY(13px);
    transition:opacity .8s ease,transform .8s ease,max-height 1s ease,padding .8s ease;background:
      radial-gradient(ellipse at 50% 0%,rgba(236,231,216,.07),transparent 42%),
      linear-gradient(145deg,rgba(17,39,62,.72),rgba(8,24,40,.56));
    border:1px solid transparent;border-radius:16px;text-align:left;backdrop-filter:blur(10px)}

    background:linear-gradient(180deg,rgba(244,239,228,.05),transparent 18%,transparent 84%,rgba(173,197,208,.03));opacity:.9}
  #panel::after{content:"";position:absolute;inset:10px;pointer-events:none;border-radius:12px;border:1px solid rgba(205,220,231,.06)}
  #panel.on{max-height:1200px;opacity:1;transform:none;padding:27px 30px 24px;border-color:rgba(205,220,231,.13);box-shadow:0 24px 70px rgba(2,8,17,.18)}
  #drawShell.reading:not(.multi){grid-template-columns:minmax(280px,430px) minmax(360px,510px);gap:48px;justify-content:center}

  #cMeta{font-size:11.5px;letter-spacing:.23em;color:var(--mist-dim);opacity:.75;margin-bottom:8px}

  #cEye{color:var(--reed);letter-spacing:.48em;text-indent:.02em;font-family:var(--serif);font-size:14px;margin-top:6px}
  #cFloat{margin-top:17px;font-family:var(--serif);font-size:18px;color:var(--moon);letter-spacing:.035em;line-height:1.75}
  #cBody{margin-top:17px;color:var(--mist);opacity:.92;font-size:14.5px;text-align:justify;text-justify:inter-ideograph;line-height:2.08}
  #cWord{margin-top:15px;color:var(--reed);font-size:12.5px;letter-spacing:.18em}
  #readingBox{margin-top:16px;border-top:1px solid rgba(205,220,231,.10);padding-top:10px;background:linear-gradient(180deg,rgba(238,233,220,.02),transparent 75%)}
  #readingBox summary{cursor:pointer;color:var(--mist);opacity:.52;font-size:12px;letter-spacing:.30em;list-style:none}
  #readingBox summary::-webkit-details-marker{display:none}
  #readingBox summary:hover{opacity:.86}
  #readingBox p{margin-top:12px;color:var(--mist);opacity:.76;font-size:13.5px;text-align:justify;line-height:1.95}
  #synth{margin:18px 0 0;padding:15px 18px 14px;border-left:1px solid rgba(188,167,124,.42);color:var(--moon);font-family:var(--serif);
    font-size:15.5px;letter-spacing:.06em;opacity:0;transform:translateY(6px);transition:opacity 1.1s,transform 1.1s;background:rgba(188,167,124,.035)}
  #synth:empty{display:none}

  .acts{margin-top:12px;display:flex;gap:12px;justify-content:flex-start;flex-wrap:wrap}
  .act{position:relative;background:linear-gradient(180deg,rgba(24,47,74,.60),rgba(12,30,50,.48));border:1px solid rgba(205,220,231,.26);color:rgba(233,239,239,.90);padding:9px 21px;letter-spacing:.22em;text-indent:.22em;
    font-size:12.5px;cursor:pointer;border-radius:999px;font-family:var(--serif);transition:border-color .35s,color .35s,background .35s,transform .35s,box-shadow .35s;
    box-shadow:0 10px 28px rgba(3,10,19,.12),0 0 0 1px rgba(237,232,219,.03) inset}

  .act:hover,.act:focus-visible{border-color:var(--reed);color:var(--moon);background:linear-gradient(180deg,rgba(25,45,69,.92),rgba(11,28,46,.84));transform:translateY(-1px);box-shadow:0 14px 34px rgba(3,10,19,.18),0 0 0 1px rgba(237,232,219,.05) inset;outline:none}
  #nextBtn{background:linear-gradient(180deg,rgba(41,68,98,.96),rgba(17,39,60,.90));border-color:rgba(188,167,124,.46);color:var(--moon);box-shadow:0 12px 34px rgba(2,9,17,.22),0 0 0 1px rgba(245,240,229,.05) inset,0 0 22px rgba(187,167,124,.08)}
  #nextBtn:hover,#nextBtn:focus-visible{background:linear-gradient(180deg,rgba(52,82,114,.98),rgba(20,47,73,.94));border-color:rgba(188,167,124,.72);box-shadow:0 16px 38px rgba(2,9,17,.26),0 0 0 1px rgba(245,240,229,.08) inset,0 0 26px rgba(187,167,124,.12)}
  .back{position:fixed;top:18px;left:20px;z-index:9;background:linear-gradient(180deg,rgba(18,34,54,.82),rgba(9,22,38,.74));border:1px solid rgba(188,167,124,.28);border-radius:999px;color:rgba(238,233,220,.90);
    opacity:.94;cursor:pointer;font-size:12px;letter-spacing:.18em;font-family:var(--serif);padding:7px 16px;backdrop-filter:blur(8px);
    box-shadow:0 8px 26px rgba(3,10,18,.18),0 0 0 1px rgba(224,219,204,.04) inset;transition:opacity .3s,border-color .3s,transform .3s,background .3s,color .3s}

  #errorNotice{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:99;padding:10px 18px;border:1px solid rgba(200,120,110,.35);

  @media (max-width:800px){

  /* ===== v0.3.1 摄影背景系统（穗） ===== */
  body.photo #sky, body.photo #stars, body.photo #moon, body.photo #hills,
  body.photo #mistline, body.photo #water, body.photo #moonpath,
  body.photo #waterline, body.photo #reeds{ display:none; }
  #bg{ position:fixed; inset:0; z-index:-2; background:#0B1626; }
  #bg img{ position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; opacity:0; transition:opacity .9s ease; }
  #bg img.on{ opacity:1; }
  /* 苇层：竖屏·选择页限定。摆幅纪律：单边≤1°，10s一来回，根部为轴 */
  #reedlayer{ position:fixed; left:0; bottom:0; z-index:-1;
    width:min(62vw,420px); pointer-events:none; display:none; }
  #reedlayer img{ width:100%; display:block; transform-origin:14% 96%;
    animation:reedsway 9s ease-in-out infinite alternate; }
  @keyframes reedsway{ from{transform:rotate(-1.2deg)} to{transform:rotate(1.1deg)} }
  @media (orientation:portrait){ body[data-stage="scenes"] #reedlayer{ display:block; } }
  @media (prefers-reduced-motion:reduce){ #reedlayer img{ animation:none } }
  /* 牌意升格为正经按钮 */
  #readingBox summary{ display:inline-block; font-size:13px; opacity:.78;
    padding:8px 22px; border:1px solid rgba(205,220,231,.26); border-radius:999px;
    background:linear-gradient(180deg,rgba(19,38,58,.72),rgba(9,24,40,.66)); }
  #readingBox summary:hover{ opacity:1; border-color:rgba(205,220,231,.45); }
  details#readingBox[open] summary{ opacity:1; border-color:rgba(185,164,124,.5); }
  /* 动作按钮加大半号 */
  .act{ font-size:14px; padding:11px 26px; }

  /* ===== v0.3.2（穗） ===== */
  /* B1 白缝修补：画布铺夜、锁横滚、背景流血位 */
  html{background:#0B1626}
  html,body{overflow-x:hidden}
  #bg{inset:-2px;z-index:0}
  #bg img{inset:-3%;width:106%;height:106%}
  #reedlayer{z-index:1}
  .stage{z-index:2;overflow-x:hidden}
  /* B2 竖排题签开屏 */
  #landing{justify-content:flex-end;align-items:center;text-align:center;padding-bottom:12vh}
  #landing::before{display:none}
  #landing h1{position:fixed;top:7vh;right:8vw;writing-mode:vertical-rl;
    font-size:clamp(40px,6.4vw,60px);letter-spacing:.42em;text-indent:0;margin:0;
    text-shadow:0 0 24px rgba(8,17,31,.65)}
  #landing p.tag{position:fixed;top:10vh;right:calc(8vw + clamp(84px,12vw,124px));
    writing-mode:vertical-rl;letter-spacing:.34em;font-size:17px;opacity:.82;
    text-shadow:0 0 18px rgba(8,17,31,.65)}
  #landing .sealimg{display:inline-block;width:1.45em;margin-inline-start:16px;opacity:.92;vertical-align:middle}
  @media (max-width:620px){
    #landing h1{top:6vh;right:9vw}
    #landing p.tag{right:calc(9vw + 68px);font-size:15px}
  }
  /* B3 牌意呼吸灯：4s一息，首次点开即退休 */
  #readingBox:not(.woken) summary{animation:inkbreath 4s ease-in-out infinite}
  @keyframes inkbreath{
    0%,100%{box-shadow:0 0 0 0 rgba(185,164,124,0)}
    50%{box-shadow:0 0 14px 2px rgba(185,164,124,.34);border-color:rgba(185,164,124,.55)}
  }
  @media (prefers-reduced-motion:reduce){#readingBox summary{animation:none}}
  /* B4 潜观印章：抽牌台左下，纯装饰 */
  #seal{position:fixed;left:26px;bottom:26px;z-index:3;pointer-events:none;display:none;user-select:none}
  #seal img{width:44px;opacity:.5;display:block}
  body[data-stage="draw"] #seal{display:block}
  @media (max-width:620px){#seal{left:14px;bottom:14px} #seal img{width:34px}}
  /* B5 绢夜双肤：data-theme="silk" 绢笺版 */
  #themeBtn{position:absolute;top:13px;right:14px;z-index:2;cursor:pointer;
    background:rgba(9,23,39,.4);border:1px solid rgba(200,216,232,.30);color:var(--mist);
    border-radius:999px;padding:5px 12px;font-size:11px;letter-spacing:.2em;opacity:.55}
  body[data-theme="silk"] #themeBtn{background:rgba(242,238,226,.8);color:#5A4E33;border-color:rgba(96,84,58,.4)}
  #themeBtn:hover{opacity:1}
  body[data-theme="silk"] #panel{
    background:linear-gradient(180deg,rgba(232,227,213,.94),rgba(222,216,200,.92));
    border-color:rgba(96,84,58,.35);color:#22354D}
  body[data-theme="silk"] #panel *{color:#22354D}
  body[data-theme="silk"] #cEye, body[data-theme="silk"] #cMeta{color:#8A7442}
  body[data-theme="silk"] #synth{color:#2A3D57;border-left-color:rgba(138,116,66,.55)}
  body[data-theme="silk"] .act,
  body[data-theme="silk"] #readingBox summary{
    background:linear-gradient(180deg,rgba(242,238,226,.9),rgba(226,220,204,.9));
    color:#22354D;border-color:rgba(96,84,58,.4)}
  body[data-theme="silk"] #readingBox p{color:rgba(34,53,77,.85)}

  /* ===== v0.3.4 汇文明朝体·开屏子集（穗） ===== */
  @font-face{
    font-family:"ShuijingSong";
    font-display:swap;
    font-weight:400; /* 常规＝SemiBold真身 */
    src:url("assets/fonts/shuijing-song-sb.woff2") format("woff2"); /* v0.3.18 换铸SemiBold */
  }
  @font-face{
    font-family:"ShuijingSong";
    font-display:swap;
    font-weight:700; /* v0.3.19 真粗体上岗，加粗不再靠浏览器涂抹 */
    src:url("assets/fonts/shuijing-song-bd.woff2") format("woff2"),
        url("assets/fonts/shuijing-song-sb.woff2") format("woff2"); /* v0.3.22 备胎链：粗体失联退族内半粗，不跌系统黑体 */
  }
  @font-face{
    font-family:"ShuijingMincho";
    font-display:swap;
    src:url("assets/fonts/shuijing-mincho.woff2") format("woff2");
    font-display:swap;
  }
  #landing h1, #landing p.tag, .enter{ font-family:"ShuijingMincho", var(--serif); }
  /* 牌意钮提亮半档 */
  #readingBox summary{ opacity:.9; border-color:rgba(205,220,231,.4);
    background:linear-gradient(180deg,rgba(26,50,76,.8),rgba(12,30,50,.7)); }

  /* ===== v0.3.5 按钮工程批（穗） ===== */
  /* P1 开屏"临水"扩号+金边+呼吸：4.8s一息，只在开屏呼吸 */
  .enter{font-size:16.5px;padding:13px 46px;border-color:rgba(188,167,124,.46);color:var(--moon)}
  body[data-stage="landing"] .enter{animation:enterbreath 4.8s ease-in-out infinite}
  @keyframes enterbreath{0%,100%{box-shadow:0 0 0 0 rgba(188,167,124,0)}
    50%{box-shadow:0 0 20px 3px rgba(188,167,124,.30);border-color:rgba(188,167,124,.75)}}
  /* P2 场景页题头换汇文明朝并加号（子集本轮扩收11字） */
  #scenes .eyebrow{font-family:"ShuijingMincho",var(--serif);font-size:15px;opacity:.94}
  #scenes .hint{font-family:"ShuijingMincho",var(--serif);font-size:20px;opacity:.90;margin-top:10px}
  /* P3 "一张/三张"徽章加号加金底 */
  .scene .mode{font-size:13px;padding:3px 13px;opacity:1;border-color:rgba(188,167,124,.52);
    background:rgba(188,167,124,.10);color:#cdb488}
  /* P4 左上"回到岸边"提亮加号 */
  .back{font-size:13.5px;padding:9px 20px;border-color:rgba(188,167,124,.5);opacity:1;color:var(--moon)}
  /* P5 牌意钮：金边加深+展开指针▾；呼吸增亮为3.6s一息，首点即退休不变 */
  #readingBox summary{list-style:none;font-size:14px;padding:9px 26px;border-color:rgba(188,167,124,.58);
    background:linear-gradient(180deg,rgba(38,58,74,.88),rgba(16,34,54,.78))}
  #readingBox summary::-webkit-details-marker{display:none}
  #readingBox summary::after{content:"▾";display:inline-block;margin-left:11px;font-size:11px;opacity:.8;
    transition:transform .35s;vertical-align:1px}
  details#readingBox[open] summary::after{transform:rotate(180deg)}
  #readingBox:not(.woken) summary{animation:inkbreath2 3.6s ease-in-out infinite}
  @keyframes inkbreath2{0%,100%{box-shadow:0 0 0 0 rgba(188,167,124,0)}
    50%{box-shadow:0 0 18px 4px rgba(188,167,124,.46);border-color:rgba(188,167,124,.9)}}
  /* P6 "绢·夜"钮提亮加号 */
  #themeBtn{font-size:12px;padding:6px 14px;opacity:.85;border-color:rgba(188,167,124,.42);color:var(--moon)}
  #themeBtn:hover{border-color:rgba(188,167,124,.7)}
  @media (prefers-reduced-motion:reduce){.enter,#readingBox summary{animation:none}}

  /* ===== v0.3.6 抽牌台工程批（穗） ===== */
  /* Q1 台头三行换明朝体并加号（子集扩收全语料428字，242KB，仍轻于一张底图） */
  #posName{font-family:"ShuijingMincho",var(--serif);font-size:16px}
  #guide{font-family:"ShuijingMincho",var(--serif);font-size:18.5px;opacity:.92}
  #touchHint{font-family:"ShuijingMincho",var(--serif);font-size:13px}
  /* Q2 牌意钮加粗提神 */
  #readingBox summary{font-weight:600;color:var(--moon);opacity:.95}
  /* Q3 三张牌签换明朝体、提亮加号 */
  .card-label{font-family:"ShuijingMincho",var(--serif);font-size:14px;color:#cdb488;text-shadow:0 0 12px rgba(7,17,31,.85)}
  .cardwrap.flipped .card-label{opacity:.96}
  /* L 三张牌位属于牌阵结构，不压在牌图上：移至牌下，做成独立的月白浅金题签 */
  /* v0.3.20 题签改眉批：撤胶囊边框与墨底——与按钮同形则被读作按钮。
     改为悬字＋一线淡金渐隐残线，是"刻在玻璃上的小字"，不是可点之物。 */
  #tableau.multi .card-label{
    display:table;position:relative;z-index:2;box-sizing:border-box;
    min-width:0;min-height:0;margin:12px auto 0;padding:0 3px 7px;
    border:none;border-radius:0;background:none;box-shadow:none;
    color:#dcc79b;font-size:12.5px;line-height:1.45;letter-spacing:.42em;text-indent:.42em;
    text-shadow:0 1px 7px rgba(3,14,26,.88),0 0 12px rgba(219,197,147,.16);
    opacity:0;transform:translateY(-4px);
    transition:opacity .7s ease,transform .7s ease}
  #tableau.multi .card-label::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(205,180,124,.50),transparent)}
  #tableau.multi .cardwrap.flipped .card-label{opacity:.98;transform:translateY(0)}
  #tableau.multi .cardwrap::after{height:56px;margin:2px auto 0}
  /* 已回看的牌只压暗牌图，位置题签维持同一阅读亮度 */
  #tableau.multi .cardwrap.settled,
  #tableau.multi .cardwrap.settled:hover,
  #tableau.multi .cardwrap.settled:focus-visible{filter:none}
  /* v0.3.21 勘误：filter 落在 .card-inner（preserve-3d 本体）会把 3D 压扁成纸片，
     背面反穿、正面失踪——已翻开的牌看起来像又扣了回去。压暗改施于牌图与名帖本身，
     不碰任何 3D 参与者；顺手把压暗放浅一档，方便整阵截图分享。 */
  #tableau.multi .cardwrap.settled .card-inner{filter:none}
  #tableau.multi .cardwrap.settled .card-front img,
  #tableau.multi .cardwrap.settled .facsimile{filter:brightness(.80) saturate(.84);transition:filter .5s ease}
  #tableau.multi .cardwrap.settled:hover .card-front img,
  #tableau.multi .cardwrap.settled:focus-visible .card-front img,
  #tableau.multi .cardwrap.settled:hover .facsimile,
  #tableau.multi .cardwrap.settled:focus-visible .facsimile{filter:brightness(.96) saturate(.94)}
  #tableau.multi .cardwrap.reviewing .card-front img,
  #tableau.multi .cardwrap.active .card-front img,
  #tableau.multi .cardwrap.reviewing .facsimile,
  #tableau.multi .cardwrap.active .facsimile{filter:none}
  #tableau.multi .cardwrap.reviewing .card-inner,
  #tableau.multi .cardwrap.active .card-inner{filter:none}
  @media (max-width:620px){
    #tableau.multi .card-label{min-width:0;margin-top:9px;padding:0 2px 6px;font-size:11px;letter-spacing:.26em;text-indent:.26em}
    #tableau.multi .cardwrap::after{height:42px}
  }
  /* Q4 牌意与动作钮并排一行，分隔线移交行首；点开牌意时独占整行 */
  .btnrow{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;margin-top:16px;
    border-top:1px solid rgba(205,220,231,.10);padding-top:14px}
  .btnrow #readingBox{margin-top:0;border-top:0;padding-top:0}
  .btnrow .acts{margin-top:0}
  #readingBox[open]{flex-basis:100%}
  /* Q5 下滑提示：面板超出一屏时在底缘呼吸，滑到底即隐 */
  #scrollcue{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:8;color:var(--reed);
    font-size:15px;opacity:0;pointer-events:none;transition:opacity .5s;text-shadow:0 0 10px rgba(7,17,31,.7)}
  #scrollcue.on{opacity:.75;animation:breathe 3.2s ease-in-out infinite}
  /* Q6 牌背"水镜"换明朝体 */
  .card-back::after{font-family:"ShuijingMincho",var(--serif)}
  /* Q7 宽裕桌面单牌加一成 */
  @media (min-width:801px) and (min-height:721px){ .cardwrap{width:min(226px,46vw)} }
  @media (prefers-reduced-motion:reduce){#scrollcue.on{animation:none}}

  /* ===== v0.3.7 定稿合入与听水批（穗） ===== */
  /* R1 牌意钮与动作钮同字体；字居中，指针右置加大 */
  #readingBox summary{font-family:var(--serif);text-align:center;position:relative;padding:9px 36px 9px 26px}
  #readingBox summary::after{position:absolute;right:13px;top:50%;margin-left:0;font-size:14px;
    transform:translateY(-50%);transition:transform .35s}
  details#readingBox[open] summary::after{transform:translateY(-50%) rotate(180deg)}
  /* R2 题眼上明朝体（子集第四炉已收编全副题眼与觉察词） */
  #cEye{font-family:"ShuijingMincho",var(--serif)}
  #cWord{font-family:"ShuijingMincho",var(--serif)}
  /* R3 听水钮：右下角四页常驻 */
  #soundBtn{position:fixed;right:18px;bottom:16px;z-index:9;font-family:"ShuijingMincho",var(--serif);
    font-size:12.5px;letter-spacing:.3em;text-indent:.3em;color:var(--mist);opacity:.72;
    background:rgba(9,23,39,.35);border:1px solid rgba(188,167,124,.4);border-radius:999px;
    padding:7px 15px;cursor:pointer;transition:all .35s}
  #soundBtn:hover{opacity:1;border-color:rgba(188,167,124,.7)}
  #soundBtn.on{color:var(--reed);border-color:rgba(188,167,124,.85);background:rgba(188,167,124,.10);opacity:.95}
  body[data-theme="silk"] #soundBtn{color:#6B5B3E;border-color:rgba(107,91,62,.5);background:rgba(233,225,206,.55)}

  /* ===== v0.3.8 终审改判批（穗） ===== */
  /* S1 题眼与觉察词退回宋体系（终审对照判定：小字号下宋体更清晰；明朝体辖区就此定界） */
  #cEye{font-family:var(--serif)}
  #cWord{font-family:var(--serif)}
  /* S2 抽牌台三行再加号 */
  #posName{font-size:17.5px}
  #guide{font-size:21px}
  #touchHint{font-size:14.5px}

  /* ===== v0.3.9 风过开屏批（穗） ===== */
  #landing{isolation:isolate}
  .windframe{position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;transition:opacity 3s ease-in-out;pointer-events:none;z-index:-1}

  /* ===== v0.3.28 手机无月风帧水色蒙版（滢滢动议、阿晏） =====
     蒙版长在风帧自身：风来才显、风退即隐，不会落到原本的有月 landing_v。
     两片不对称侧向水色切断并轻钝过于完整的外环；水心、内圈与中轴碎光仍清。 */
  @media (orientation:portrait){
    #landing .windframe{overflow:hidden}
    #landing .windframe::before,#landing .windframe::after{
      content:"";position:absolute;top:42%;bottom:-9%;width:62%;pointer-events:none;
      -webkit-backdrop-filter:blur(.78px) saturate(.95);
      backdrop-filter:blur(.78px) saturate(.95)
    }
    #landing .windframe::before{
      left:-18%;
      background:radial-gradient(ellipse at 32% 58%,rgba(5,25,43,.34),rgba(6,27,45,.18) 48%,transparent 76%);
      -webkit-mask-image:radial-gradient(ellipse 86% 67% at 32% 58%,#000 0 48%,transparent 78%);
      mask-image:radial-gradient(ellipse 86% 67% at 32% 58%,#000 0 48%,transparent 78%)
    }
    #landing .windframe::after{
      right:-20%;top:45%;
      background:radial-gradient(ellipse at 68% 55%,rgba(4,22,39,.31),rgba(6,26,44,.16) 46%,transparent 76%);
      -webkit-mask-image:radial-gradient(ellipse 84% 69% at 68% 55%,#000 0 46%,transparent 78%);
      mask-image:radial-gradient(ellipse 84% 69% at 68% 55%,#000 0 46%,transparent 78%)
    }
  }

  /* ===== v0.3.10 风过修订批（穗） ===== */
  .foglayer{position:absolute;inset:-15% -25%;z-index:-1;pointer-events:none;opacity:0;
    transform:translateX(-6%);
    transition:opacity 2.6s ease-in-out, transform 9s ease-in-out;
    background:
      radial-gradient(42% 30% at 18% 42%, rgba(203,217,230,.50), transparent 70%),
      radial-gradient(50% 26% at 55% 38%, rgba(191,208,224,.44), transparent 72%),
      radial-gradient(38% 24% at 82% 47%, rgba(203,217,230,.46), transparent 70%),
      radial-gradient(70% 32% at 40% 54%, rgba(170,192,212,.30), transparent 75%)}
  .mripple{position:fixed;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1.5px solid rgba(214,228,240,.55);pointer-events:none;z-index:3;
    transform:scale(.2) scaleY(.35);opacity:.7;animation:mrip 1.6s ease-out forwards}
  @keyframes mrip{to{transform:scale(9) scaleY(.35);opacity:0;border-width:.5px}}
  @media (prefers-reduced-motion:reduce){.mripple{display:none}}

  /* ===== v0.3.12 场景与涟漪批（穗） ===== */
  /* T1 场景题头：金色加深一档并罩夜色描影，白雾之上立得住 */
  #scenes .eyebrow{color:#b39355;opacity:1;
    text-shadow:0 1px 12px rgba(7,17,31,.85),0 0 3px rgba(7,17,31,.6)}
  #scenes .hint{text-shadow:0 1px 14px rgba(7,17,31,.9),0 0 4px rgba(7,17,31,.65)}
  /* T2 div涟漪退役（改走抽卡台画布引擎） */
  .mripple{display:none}

  /* ===== v0.3.13 场景页定点返修 B（阿晏） ===== */
  #sceneRippleFx{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .9s ease,visibility 0s linear .9s}
  body[data-stage="scenes"] #sceneRippleFx,
  body[data-stage="draw"] #sceneRippleFx,
  body[data-stage="landing"] #sceneRippleFx{opacity:1;visibility:visible;transition-delay:0s}

  /* 题头移入雾线较深处：暖金与月白，不再以灰蓝或大块黑影求对比。 */
  #scenes .scene-head{transform:translateY(-27px);margin-bottom:2px}
  #scenes .eyebrow{color:#b58e50;opacity:1;
    text-shadow:0 1px 1px rgba(250,240,215,.20),0 2px 7px rgba(8,22,35,.42)}
  #scenes .hint{color:#ece6d8;opacity:.96;
    text-shadow:0 1px 7px rgba(7,21,34,.58),0 0 2px rgba(7,21,34,.42)}

  /* 卡片回到中性墨蓝并添一线暖边；不再加青、不再全页压暗。 */
  #scenes .scene{background:linear-gradient(145deg,rgba(31,48,59,.62),rgba(18,34,46,.50));
    border-color:rgba(220,209,186,.27);color:rgba(244,238,225,.96);
    box-shadow:0 14px 36px rgba(4,13,22,.14),inset 0 1px rgba(247,239,218,.08);
    backdrop-filter:blur(7px) saturate(1.02)}
  #scenes .scene:hover,#scenes .scene:focus-visible{background:linear-gradient(145deg,rgba(38,57,69,.70),rgba(22,40,52,.60));
    border-color:rgba(199,176,128,.55);box-shadow:0 20px 44px rgba(4,13,22,.20),inset 0 1px rgba(247,239,218,.10)}
  #scenes .scene b{color:rgba(247,240,225,.97);text-shadow:0 1px 4px rgba(6,17,27,.26)}
  #scenes .scene .desc{color:rgba(224,227,225,.84);opacity:1}
  #scenes .scene .mode{color:#d0b374;border-color:rgba(201,177,126,.50);background:rgba(173,140,77,.09)}
  /* v0.3.23 竖屏开屏月影亦开纹（锚点按 landing_v 亮斑实测），旧禁令撤 */
  @media (prefers-reduced-motion:reduce){#sceneRippleFx{display:none}
    #sceneReedLayers .reed-back,#sceneReedLayers .reed-original,#sceneReedLayers .reed-sweep,#sceneReedLayers .reed-main,
    #sceneReedPortraitRig .portrait-reed-back,#sceneReedPortraitRig .portrait-reed-mid,#sceneReedPortraitRig .portrait-reed-tall,
    #sceneReedPortraitRig .portrait-reed-short,#sceneReedPortraitRig .portrait-reed-front{animation:none!important}}

  /* ===== v0.3.13 场景页芦苇风动 C（阿晏） =====
     四张图与横版静水底图同画幅，保持原位叠合；只绕各自根部做亚像素级错拍轻摆。 */
  #sceneReedLayers{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;
    opacity:0;visibility:hidden;overflow:hidden;transition:opacity 1.15s ease,visibility 0s linear 1.15s}
  body[data-stage="scenes"] #sceneReedLayers{opacity:1;visibility:visible;transition-delay:0s}
  #sceneReedRig{position:absolute;left:clamp(28px,5.2vw,108px);bottom:-3px;
    width:clamp(300px,29vw,470px);aspect-ratio:540/521;transform-origin:25% 100%}
  #sceneReedLayers .reed-motion{position:absolute;inset:0;will-change:transform;backface-visibility:hidden}
  #sceneReedLayers .motion-back{z-index:1;transform-origin:26.3% 98.5%}
  #sceneReedLayers .motion-original{z-index:2;transform-origin:41.9% 98.5%}
  #sceneReedLayers .motion-sweep{z-index:3;transform-origin:23% 98.5%}
  #sceneReedLayers .motion-main{z-index:4;transform-origin:19.3% 98.5%}
  #sceneReedLayers img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;
    will-change:transform;backface-visibility:hidden;animation-play-state:paused}
  body[data-stage="scenes"] #sceneReedLayers img{animation-play-state:running}
  #sceneReedLayers .reed-back{transform-origin:26.3% 98.5%;animation:sceneReedBack 18.6s cubic-bezier(.34,.06,.19,1) .04s infinite}
  #sceneReedLayers .reed-original{transform-origin:41.9% 98.5%;animation:sceneReedOriginal 17.2s cubic-bezier(.34,.06,.19,1) .16s infinite}
  #sceneReedLayers .reed-sweep{transform-origin:23% 98.5%;animation:sceneReedSweep 19.4s cubic-bezier(.34,.06,.19,1) .22s infinite}
  #sceneReedLayers .reed-main{transform-origin:19.3% 98.5%;animation:sceneReedMain 18s cubic-bezier(.34,.06,.19,1) .10s infinite}
  @keyframes sceneReedBack{
    0%,6%,40%,100%{transform:translate3d(0,0,0) rotate(0)}
    15%{transform:translate3d(-1.31px,0,0) rotate(-1.25deg)}
    24%{transform:translate3d(-0.31px,0,0) rotate(-0.3deg)}
    32%{transform:translate3d(-0.07px,0,0) rotate(-0.07deg)}
    52%{transform:translate3d(0,0,0) rotate(0)}
    59%{transform:translate3d(-2.15px,0,0) rotate(-2.05deg)}
    67%{transform:translate3d(0.27px,0,0) rotate(0.3deg)}
    75%{transform:translate3d(-0.94px,0,0) rotate(-0.9deg)}
    85%{transform:translate3d(-0.2px,0,0) rotate(-0.2deg)}
    93%{transform:translate3d(0,0,0) rotate(0)}
  }
  @keyframes sceneReedOriginal{
    0%,6%,40%,100%{transform:translate3d(0,0,0) rotate(0)}
    15%{transform:translate3d(-1.73px,0,0) rotate(-1.65deg)}
    24%{transform:translate3d(-0.41px,0,0) rotate(-0.4deg)}
    32%{transform:translate3d(-0.1px,0,0) rotate(-0.1deg)}
    52%{transform:translate3d(0,0,0) rotate(0)}
    59%{transform:translate3d(-2.78px,0,0) rotate(-2.65deg)}
    67%{transform:translate3d(0.41px,0,0) rotate(0.45deg)}
    75%{transform:translate3d(-1.22px,0,0) rotate(-1.17deg)}
    85%{transform:translate3d(-0.27px,0,0) rotate(-0.27deg)}
    93%{transform:translate3d(0,0,0) rotate(0)}
  }
  @keyframes sceneReedSweep{

<script src="data/cards.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const stages = {landing:$('landing'), scenes:$('scenes'), draw:$('draw')};
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (typeof CARDS === 'undefined' || !Array.isArray(CARDS) || !CARDS.length){
    $('errorNotice').textContent = '牌库没有载入，请确认 data/cards.js 与网页位于同一文件夹结构中。';
    $('errorNotice').style.display = 'block';
    return;
  }

  function show(name){
    for (const k in stages) stages[k].classList.toggle('on', k===name);
    $('backBtn').hidden = (name==='landing');
    $('backBtn').textContent = (name==='draw') ? '回到岸边' : '回到水边';
    if(name!=='draw') resetDrawView();
    document.body.dataset.stage = name;
    document.body.classList.remove('reading');
    setBg(name);
  }

  /* —— v0.3.1 摄影背景：横竖双轨 + 交叉淡入（穗） —— */
  const BGKEYS = ['landing','scenes','draw','result'];
  const bgImgs = [$('bgA'), $('bgB')];
  let bgFlip = 0, bgCur = '';
  function bgSrc(key){
    const v = matchMedia('(orientation: portrait)').matches ? 'v' : 'h';
    if(key==='scenes'&&v==='h') return 'assets/bg/scenes_h_calm_blue.webp';
    return 'assets/bg/' + key + '_' + v + '.webp';
  }
  function setBg(key){
    if (document.body.classList.contains('reading')) key = 'result';
    const src = bgSrc(key);
    if (src === bgCur) return;
    bgCur = src;
    bgFlip ^= 1;
    const img = bgImgs[bgFlip], other = bgImgs[bgFlip^1];
    img.onload = () => { img.classList.add('on'); other.classList.remove('on'); };
    img.src = src;
    if (img.complete) { img.classList.add('on'); other.classList.remove('on'); }
  }
  matchMedia('(orientation: portrait)').addEventListener('change', ()=>{
    bgCur=''; setBg(document.body.classList.contains('reading') ? 'result' : (document.body.dataset.stage||'landing'));
  });
  addEventListener('load', ()=>{ for (const k of BGKEYS) for (const v of ['h','v'])
    { const i=new Image(); i.src=(k==='scenes'&&v==='h')?'assets/bg/scenes_h_calm_blue.webp':'assets/bg/'+k+'_'+v+'.webp'; } });
  setBg('landing');

  /* v0.3.2: 牌意呼吸灯——首次点开即退休 */
  $('readingBox').addEventListener('toggle', function once(){
    if (this.open){ this.classList.add('woken'); this.removeEventListener('toggle', once); }
  });
  /* v0.3.2: 绢夜双肤 */
  $('themeBtn').addEventListener('click', ()=>{
    const b=document.body;
    b.dataset.theme = (b.dataset.theme==='silk' ? '' : 'silk');
    $('themeBtn').textContent = b.dataset.theme==='silk' ? '夜 · 绢' : '绢 · 夜';
  });

  /* 涟漪 */
  const cv = $('ripples'), ctx = cv.getContext('2d');
  let ripples = [];
  function size(){
    const ratio = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * ratio);
    cv.height = Math.round(innerHeight * .42 * ratio);
    cv.style.width = innerWidth+'px';
    cv.style.height = Math.round(innerHeight*.42)+'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }
  addEventListener('resize', size); size();
  function addRipple(x,y,intensity=.5){
    if(reduced) return;
    ripples.push({x,y,r:4,a:intensity});
    ripples.push({x,y,r:0,a:intensity*.72,d:13});  }
  window.__sjRipple = addRipple;   /* v0.3.12 供开屏与场景页共用 */
  (function loop(){
    const w = innerWidth, h = innerHeight*.42;
    ctx.clearRect(0,0,w,h);
    ripples = ripples.filter(p => p.a > .012);
    for (const p of ripples){
      if (p.d){ p.d--; }
      else { p.r += 1.45 + p.r*.012; p.a *= .971; }
      ctx.beginPath();
      ctx.ellipse(p.x,p.y,p.r,p.r*.30,0,0,Math.PI*2);
      ctx.strokeStyle = 'rgba(131,174,187,'+p.a.toFixed(3)+')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  })();

  const S = {scene:null,count:1,spread:null,order:[],idx:0,phase:'idle'};
  const pickText = v => Array.isArray(v) ? v[Math.floor(Math.random()*v.length)] : (v || '');

  function spreadFor(scene,count){
    if(count!==3 || typeof SPREADS==='undefined') return null;
    return SPREADS[scene==='照见自我' ? '照见自我·三张' : '关系回声·三张'] || null;
  }
  function sample(n){
    const pool = CARDS.slice(), out=[];
    for(let i=0;i<n;i++) out.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    return out;
  }
  function resetDrawView(){
    S.phase='idle';
    $('tableau').innerHTML='';
    $('tableau').className='';
    $('drawShell').className='';
    clearPanel(true);
  }
  function begin(scene,count){
    S.scene=scene;
    S.count=count;
    S.spread=spreadFor(scene,count);
    const rate=(typeof SPREADS!=='undefined' && Number.isFinite(SPREADS.reversedRate)) ? SPREADS.reversedRate : .3;
    S.order=sample(count).map(card=>({card,reversed:Math.random()<rate,wrap:null,revealed:false}));
    S.idx=0;
    $('tableau').innerHTML='';
    $('tableau').className=count===3?'multi':'';
    $('drawShell').className=count===3?'multi':'';
    show('draw');
    stepGuide();
  }
  function stepGuide(){
    S.phase='await';
    clearPanel(false);
    setActiveCard(-1);
    const pos=S.spread ? S.spread.positions[S.idx] : null;
    $('posName').textContent=pos ? pos['位置名'] : '';
    $('guide').textContent=pos ? pickText(pos['引导语']) : '定一定神，想着那件事。';
    $('touchHint').classList.add('on');
  }
  function onWaterTouch(ev){
    if(S.phase!=='await' || !stages.draw.classList.contains('on')) return;
    if(ev.target.closest('button,summary,details,#panel')) return;
    const rect=cv.getBoundingClientRect();
    if(ev.clientY<rect.top) return;
    addRipple(ev.clientX-rect.left,ev.clientY-rect.top,.58);
    S.phase='rising';
    $('touchHint').classList.remove('on');
    setTimeout(riseCard,reduced?40:420);
  }
  function makeCardNode(item,index){
    const wrap=document.createElement('button');
    wrap.type='button';
    wrap.className='cardwrap active';
    wrap.dataset.index=String(index);
    wrap.setAttribute('aria-label',item.card.name+(item.reversed?'，逆位':''));

    const inner=document.createElement('div');
    inner.className='card-inner';
    const back=document.createElement('div');
    back.className='card-face card-back';
    const front=document.createElement('div');
    front.className='card-face card-front';
    const rotator=document.createElement('div');
    rotator.className='front-rotator'+(item.reversed?' reversed':'');
    const img=document.createElement('img');
    img.alt=item.card.name;
    img.loading='eager'; img.decoding='async';
    const fallback=document.createElement('div');
    fallback.className='facsimile';
    fallback.innerHTML='<div class="disc"></div><div class="nm"></div>';
    fallback.querySelector('.nm').textContent=item.card.name;
    img.addEventListener('error',()=>{ img.remove(); front.classList.add('fallback'); });
    /* v0.3.18 名帖改候补制：超时只请名帖垫场，不再撤下还在赶路的图；图到即掀帘归位 */
    img.addEventListener('load',()=>{ if(img.naturalWidth>0){ front.classList.remove('fallback'); } });
    img.src=item.card.image;
    setTimeout(()=>{ if(front.isConnected && !front.classList.contains('fallback') && (!img.complete || img.naturalWidth===0)){
      front.classList.add('fallback'); } },4500);
    rotator.append(img,fallback);
    front.append(rotator);
    inner.append(back,front);
    const label=document.createElement('div');
    label.className='card-label';
    label.textContent=S.spread ? S.spread.positions[index]['位置名'] : '';
    wrap.append(inner,label);
    wrap.addEventListener('click',()=>reviewCard(index));
    return wrap;
  }
  function riseCard(){
    const item=S.order[S.idx];
    const wrap=makeCardNode(item,S.idx);
    item.wrap=wrap;
    $('tableau').appendChild(wrap);
    if(window.__sjRippleSurge) window.__sjRippleSurge('draw'); /* v0.3.23 牌起水开 */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      wrap.classList.add('risen');
      setTimeout(()=>{
        wrap.classList.add('flipped');
        setTimeout(reveal,reduced?30:780);
      },reduced?30:1050);
    }));
  }
  function reveal(){
    const item=S.order[S.idx];
    item.revealed=true;
    S.phase='revealed';
    $('touchHint').classList.remove('on');
    $('guide').textContent='';
    renderPanel(S.idx);
    const last=S.idx===S.count-1;
    $('nextBtn').hidden=last;
    $('againBtn').hidden=!last;
    $('shoreBtn').hidden=!last;
    if(last){ document.body.classList.add('reading'); setBg('result'); }
    if(last && S.spread){
      $('guide').textContent='轻触牌面，可回看每一面。';
      $('synth').textContent=pickText(S.spread['合读句']);
      setTimeout(()=>$('synth').classList.add('on'),reduced?20:650);
    }
  }
  function renderPanel(index){
    const item=S.order[index];
    if(!item || !item.revealed) return;
    setActiveCard(index);
    const base=item.card.scenes[S.scene];
    const text=item.reversed ? base['逆位'] : base;
    const pos=S.spread ? S.spread.positions[index] : null;
    $('cMeta').textContent=(pos ? pos['位置名']+' · '+pos['含义']+'　' : '')+(item.reversed?'逆位':'正位');
    $('cName').textContent=item.card.name;
    $('cEye').textContent=text['题眼'] || '';
    $('cFloat').textContent=text['浮句'] || '';
    $('cBody').textContent=text['展开'] || '';
    $('cWord').textContent=text['觉察词'] ? '觉察词 · '+text['觉察词'] : '';
    $('cReading').textContent=item.card.reading || '';
    $('readingBox').style.display=item.card.reading?'':'none';
    $('readingBox').removeAttribute('open');
    $('panel').classList.add('on');
    $('drawShell').classList.add('reading');
  }
  function setActiveCard(index){
    S.order.forEach((item,i)=>{
      if(!item.wrap) return;
      item.wrap.classList.toggle('active',i===index);
      item.wrap.classList.toggle('reviewing',i===index && item.revealed);
      item.wrap.classList.toggle('settled',item.revealed && i!==index);
    });
  }
  function reviewCard(index){
    const item=S.order[index];
    if(!item || !item.revealed || S.phase==='rising') return;
    renderPanel(index);
  }
  function clearPanel(hard){
    $('panel').classList.remove('on');
    $('drawShell').classList.remove('reading');
    ['cMeta','cName','cEye','cFloat','cBody','cWord','cReading','synth'].forEach(id=>$(id).textContent='');
    $('synth').classList.remove('on');
    ['nextBtn','againBtn','shoreBtn'].forEach(id=>$(id).hidden=true);
    if(hard) $('readingBox').removeAttribute('open');
  }
  function nextCard(){
    const current=S.order[S.idx];
    if(current && current.wrap){
      current.wrap.classList.remove('active','reviewing');
      current.wrap.classList.add('settled');
    }
    S.idx++;
    stepGuide();
  }

  $('enterBtn').addEventListener('click',()=>show('scenes'));
  document.querySelectorAll('.scene').forEach(button=>button.addEventListener('click',()=>begin(button.dataset.scene,+button.dataset.count)));
  $('backBtn').addEventListener('click',()=>show(stages.draw.classList.contains('on')?'scenes':'landing'));
  $('nextBtn').addEventListener('click',nextCard);
  $('againBtn').addEventListener('click',()=>begin(S.scene,S.count));
  $('shoreBtn').addEventListener('click',()=>show('scenes'));
  addEventListener('pointerdown',onWaterTouch);
  addEventListener('pointermove',ev=>{
    if(Math.random()<.055 && stages.draw.classList.contains('on') && S.phase==='await'){
      const rect=cv.getBoundingClientRect();
      if(ev.clientY>rect.top) addRipple(ev.clientX-rect.left,ev.clientY-rect.top,.12);
    }
  });
})();
/* v0.3.6 下滑提示（穗）：只在抽牌页、且面板越出一屏时呼吸 */
(function(){
  const cue=document.getElementById('scrollcue'), d=document.getElementById('draw');
  if(!cue||!d) return;
  function chk(){
    const need=document.body.dataset.stage==='draw' && (d.scrollHeight-d.clientHeight-d.scrollTop>48);
    cue.classList.toggle('on',need);
  }
  d.addEventListener('scroll',chk,{passive:true});
  window.addEventListener('resize',chk);
  if(window.ResizeObserver){ new ResizeObserver(chk).observe(document.getElementById('panel')); }
  new MutationObserver(chk).observe(document.body,{attributes:true,attributeFilter:['data-stage']});
})();
/* v0.3.7 听水引擎（穗）：终审配比 缓.8 清.4 风.8 纹.7 总量1.0；缓清共用闸门错开；铃与快滴除名 */
(function(){
  const btn=document.getElementById('soundBtn'); if(!btn) return;
  let ctx=null,master=null,verb=null,on=true,started=false,timers=[],gateEnd=0;
  const R=(a,b)=>a+Math.random()*(b-a);
  function later(ms,fn){ timers.push(setTimeout(fn,ms)); }
  function ac(){ if(ctx) return ctx;
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=1.0; master.connect(ctx.destination);
    const n=(ctx.sampleRate*1.8)|0, buf=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); let lp=0;
      for(let i=0;i<n;i++){ const w=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.45));
        lp+=0.25*(w-lp); d[i]=lp; } }
    verb=ctx.createConvolver(); verb.buffer=buf;
    const wg=ctx.createGain(); wg.gain.value=0.8; verb.connect(wg).connect(master);
    return ctx; }
  function noiseBuf(sec){ const c=ac(),b=c.createBuffer(1,Math.max(1,c.sampleRate*sec)|0,c.sampleRate),
    d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
  function oneDrop(f0,t,amp,decay,tickF){
    const c=ac();
    const tick=c.createBufferSource(); tick.buffer=noiseBuf(0.006);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=tickF; bp.Q.value=1.1;
    const tg=c.createGain(); tg.gain.setValueAtTime(amp*0.14,t); tg.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    tick.connect(bp).connect(tg); tg.connect(master); tg.connect(verb); tick.start(t);
    [[1,1],[2,0.24],[3,0.08]].forEach(([h,a])=>{
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f0*h;
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(amp*a,t+0.014);
      g.gain.exponentialRampToValueAtTime(0.0001,t+decay);
      o.connect(g); g.connect(master); g.connect(verb); o.start(t); o.stop(t+decay+0.2); });
  }
  const LOWSET=[164.81,185.00,207.65,220,246.94], HIGHSET=[329.63,369.99,415.30,440,493.88];
  function reserve(span){ const c=ac(); let s=c.currentTime+0.06;
    if(s<gateEnd) s=gateEnd+R(0.3,0.9);
    gateEnd=s+span; return s; }
  function clusterSlow(){
    let k=1+((Math.random()*3)|0), span=k*0.5+0.6, t=reserve(span);
    while(k>0){
      const f=LOWSET[(Math.random()*LOWSET.length)|0], rep=1+((Math.random()*2)|0);
      for(let i=0;i<Math.min(rep,k);i++){ oneDrop(f,t,R(0.06,0.11)*0.8,2.1,1800); t+=R(0.34,0.6); }
      k-=rep; }
  }
  function clusterHigh(){
    let k=2+((Math.random()*4)|0), span=k*0.3+0.5, t=reserve(span);
    while(k>0){
      const f=HIGHSET[(Math.random()*HIGHSET.length)|0], rep=1+((Math.random()*3)|0);
      for(let i=0;i<Math.min(rep,k);i++){ oneDrop(f,t,R(0.05,0.09)*0.4,1.15,2600); t+=R(0.18,0.38); }
      k-=rep; }
  }
  function breath(){
    const c=ac(),t=c.currentTime+0.05,dur=R(7,13),v=0.07*0.8;
    const s=c.createBufferSource(); s.buffer=noiseBuf(dur+1);
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4.5;
    bp.frequency.setValueAtTime(R(260,420),t); bp.frequency.linearRampToValueAtTime(R(480,760),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(v,t+dur*0.35); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    s.connect(bp).connect(g).connect(master); s.start(t); s.stop(t+dur+0.2);
  }
  function ripple(){
    const c=ac(),t=c.currentTime+0.05,dur=R(1.2,2.6),v=0.08*0.7;
    const s=c.createBufferSource(); s.buffer=noiseBuf(dur+0.5);
    const lp=c.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(R(420,760),t); lp.frequency.linearRampToValueAtTime(R(260,420),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(v,t+dur*0.4); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    s.connect(lp).connect(g).connect(master); s.start(t); s.stop(t+dur+0.1);
  }
  function loopSlow(){ if(!on) return; clusterSlow(); later(R(5000,8000),loopSlow); }
  function loopHigh(){ if(!on) return; clusterHigh(); later(R(3200,5600),loopHigh); }
  window.__sjBreath=function(){ if(on&&started) breath(); };
  function loopWind(){ if(!on) return;
    if(document.body.dataset.stage!=='landing') breath();  /* 开屏由风过引擎驱动，别处自吹 */
    later(R(16000,32000),loopWind); }
  function loopWater(){ if(!on) return; ripple(); later(R(4500,10000),loopWater); }
  function startLoops(){ gateEnd=0;
    loopSlow(); later(1200,loopHigh); later(2500,loopWind); later(600,loopWater); }
  function ensureStarted(){ if(on && !started){ started=true; ac().resume(); startLoops(); } }
  /* 默认开启：浏览器王法要求首个手势后方可出声——访客点"临水"入湖的那一下就是令箭 */
  document.addEventListener('pointerdown', ensureStarted, {capture:true});
  btn.textContent='止 水'; btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
  btn.addEventListener('click',()=>{
    if(!on){ on=true;
      if(started){ ac().resume(); startLoops(); } else ensureStarted();
      btn.textContent='止 水'; btn.classList.add('on'); btn.setAttribute('aria-pressed','true');
    }else{ on=false; timers.forEach(clearTimeout); timers=[];
      if(ctx) ctx.suspend();
      btn.textContent='听 水'; btn.classList.remove('on'); btn.setAttribute('aria-pressed','false'); }
  });
})();
/* v0.3.9/10 风过引擎（穗）：静→雾起→初散→风盛→雾散→归静，约十一秒；与远风气息同吹。
   叠序修订：帧按 w1、w2、雾 依次后置，后者居上——v0.3.9 的风盛帧被压底从未露脸，此病已医。
   USE_PEAK 改 false 退回两帧化裁。 */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const landing=document.getElementById('landing'); if(!landing) return;
  const USE_PEAK=true;
  let w1=null,w2=null,fog=null,busy=false;
  function mk(cls,src){ const d=document.createElement('div'); d.className=cls;
    if(src) d.style.backgroundImage='url('+src+')';
    if(cls==='windframe') d.style.cssText+=';position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease-in-out;pointer-events:none;z-index:-1';
    landing.appendChild(d); return d; }
  let lastPortrait=null;
  function prep(){ const p=matchMedia('(orientation:portrait)').matches;
    if(w1 && lastPortrait===p) return;
    [w1,w2,fog].forEach(d=>d&&d.remove()); w1=w2=fog=null; lastPortrait=p;
    if(p){ w1=mk('windframe','assets/bg/landing_windv.webp'); }        /* 竖屏两帧弧 */
    else{ w1=mk('windframe','assets/bg/landing_wind1.webp');
      if(USE_PEAK) w2=mk('windframe','assets/bg/landing_wind2.webp'); }
    fog=mk('foglayer'); }
  function windPass(){
    if(busy) return;
    if(document.body.dataset.stage!=='landing') return;
    busy=true; prep();
    if(window.__sjBreath) window.__sjBreath();
    fog.style.opacity=1; fog.style.transform='translateX(6%)';   /* 雾起，顺风东行 */
    w1.style.opacity=1;
    if(USE_PEAK&&w2) setTimeout(()=>{ w2.style.opacity=1; },2200);   /* 换幕在雾底下完成 */
    setTimeout(()=>{ fog.style.opacity=0; },4600);                   /* 雾被吹散，露出无月湖面 */
    setTimeout(()=>{ if(USE_PEAK&&w2) w2.style.opacity=0; },6600);
    setTimeout(()=>{ w1.style.opacity=0; },7800);
    setTimeout(()=>{ fog.style.transform='translateX(-6%)'; busy=false; },11200);
  }
  (function loop(){ setTimeout(()=>{ windPass(); loop(); }, 22000+Math.random()*18000); })();
  setTimeout(windPass, 3200);   /* 首风提前：入湖三秒二 */
})();
/* v0.3.13 三阶段指尖涟漪 H（阿晏）：移动只留一枚淡波，按下两圈回响；不遮挡任何控件。 */
(function(){
  const cv=document.getElementById('cursorRippleFx');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  if(!cv||reduced.matches) return;
  const cx=cv.getContext('2d');
  const stages=new Set(['landing','scenes','draw']);
  let W=0,H=0,DPR=1,lastMove=0,lastX=-999,lastY=-999,events=[];
  function sizeCursorRipple(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.6);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    cx.setTransform(DPR,0,0,DPR,0,0);
  }
  function add(x,y,strength=.12,paired=false){
    const now=performance.now();
    events.push({x,y,start:now,delay:0,duration:paired?1550:1180,max:paired?76:43,alpha:strength});
    if(paired)events.push({x,y,start:now,delay:155,duration:1420,max:61,alpha:strength*.55});
  }
  function easeOut(t){return 1-Math.pow(1-t,3)}
  function drawCursorRipple(t){
    requestAnimationFrame(drawCursorRipple);
    cx.clearRect(0,0,W,H);
    events=events.filter(e=>t-e.start-e.delay<e.duration);
    for(const e of events){
      const age=(t-e.start-e.delay)/e.duration;
      if(age<0||age>1)continue;
      const q=easeOut(age),life=Math.pow(Math.sin(Math.PI*age),.92);
      const rx=5+q*e.max,ry=rx*(.28+age*.035);
      cx.save();cx.translate(e.x,e.y);cx.beginPath();
      cx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
      cx.strokeStyle='rgba(179,215,228,'+(life*e.alpha).toFixed(4)+')';
      cx.lineWidth=.72+life*.38;
      cx.shadowColor='rgba(226,235,231,'+(life*e.alpha*.24).toFixed(4)+')';
      cx.shadowBlur=3.5;cx.stroke();cx.restore();
    }
  }
  document.addEventListener('pointermove',e=>{
    if(!stages.has(document.body.dataset.stage)||e.pointerType==='touch')return;
    const now=performance.now(),distance=Math.hypot(e.clientX-lastX,e.clientY-lastY);
    if(now-lastMove<260||distance<22)return;
    lastMove=now;lastX=e.clientX;lastY=e.clientY;
    const inDrawWater=document.body.dataset.stage==='draw'&&e.clientY>=innerHeight*.58;
    add(e.clientX,e.clientY,inDrawWater?.07:.105,false);
  },{passive:true});
  document.addEventListener('pointerdown',e=>{
    if(!stages.has(document.body.dataset.stage))return;
    const drawEngineOwnsRipple=document.body.dataset.stage==='draw'&&
      e.clientY>=innerHeight*.58&&!e.target.closest('button,summary,details,#panel');
    if(drawEngineOwnsRipple)return;
    add(e.clientX,e.clientY,.34,true);
  },{passive:true});
  addEventListener('resize',sizeCursorRipple,{passive:true});
  sizeCursorRipple();requestAnimationFrame(drawCursorRipple);
})();
/* v0.3.13 双页局部涟漪 G（阿晏）：场景页保持 F 版，开屏波幅与可见度微增。 */
(function(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.getElementById('sceneRippleFx');
  if(!cv) return;
  const cx=cv.getContext('2d');
  const AR=16/9;
  const CONFIG={
    scenes:{fx:.690,fy:.820,maxW:.18,maxH:.29,duration:4400,alpha:.18,
      pfx:.66,pfy:.872,pmaxW:.30,pmaxH:.085,palpha:.15,
      panchors:[[.66,.872,1],[.40,.925,.72]]}, /* v0.3.23 竖屏双渚：月渚为主，苇脚水面为辅 */
    landing:{fx:.505,fy:.545,maxW:.195,maxH:.30,duration:4300,alpha:.175,
      pfx:.53,pfy:.59,pmaxW:.62,pmaxH:.30,palpha:.17,pduration:5600}, /* v0.3.25 整湖荡开：环径至屏宽尺度，环命随之放长 */
    draw:{fx:.500,fy:.430,maxW:.15,maxH:.24,duration:4200,alpha:.15,
      pfx:.50,pfy:.315,pmaxW:.26,pmaxH:.075,palpha:.13} /* v0.3.23 抽卡台中央荡开 */
  };
  const isPortrait=()=>matchMedia('(orientation:portrait)').matches;
  let W=0,H=0,DPR=1,last=0,events=[];
  function sizeSceneRipple(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.6);
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    cx.setTransform(DPR,0,0,DPR,0,0);
  }
  function spot(config){
    if(isPortrait()&&config.pfx){return{x:config.pfx*W,y:config.pfy*H};}
    let dw,dh,ox,oy;
    if(W/H>=AR){dw=W;dh=W/AR;ox=0;oy=(H-dh)/2;}
    else{dh=H;dw=H*AR;oy=0;ox=(W-dw)/2;}
    return{x:ox+config.fx*dw,y:oy+config.fy*dh};
  }
  function easeOutCubic(t){return 1-Math.pow(1-t,3);}
  function surge(stage=document.body.dataset.stage){
    const config=CONFIG[stage];
    if(!config) return;
    if(isPortrait()&&!config.pfx) return; /* v0.3.21 竖屏只在备有月渚锚点的页面产纹 */
    const now=performance.now();
    let pt=null;
    if(isPortrait()&&config.panchors){
      const a=config.panchors[Math.floor(Math.random()*config.panchors.length)];
      pt={x:a[0]*W,y:a[1]*H,s:a[2]};
    }
    const dur=(isPortrait()&&config.pduration)?config.pduration:config.duration;
    events.push({stage,start:now,delay:0,strength:(pt?pt.s:1),seed:0,duration:dur,pt});
    events.push({stage,start:now,delay:420,strength:(pt?pt.s:1)*.58,seed:1,duration:dur,pt});
  }
  function draw(t){
    requestAnimationFrame(draw);
    if(t-last<32)return;last=t;
    cx.clearRect(0,0,W,H);
    const stage=document.body.dataset.stage,config=CONFIG[stage];
    if(!config)return;
    const p=spot(config),__pt=isPortrait(),
      maxR=__pt&&config.pmaxW?Math.min(W*config.pmaxW,H*config.pmaxH):Math.min(W*config.maxW,H*config.maxH),
      __alpha=__pt&&config.palpha?config.palpha:config.alpha;
    events=events.filter(e=>t-e.start-e.delay<e.duration);
    for(const e of events){
      if(e.stage!==stage)continue;
      const age=(t-e.start-e.delay)/e.duration;
      if(age<0||age>1)continue;
      const q=easeOutCubic(age),life=Math.pow(Math.sin(Math.PI*age),.86);
      const rx=16+q*maxR,ry=rx*(.19+age*.022);
      cx.save();cx.translate(e.pt?e.pt.x:p.x,e.pt?e.pt.y:p.y);cx.beginPath();
      cx.setLineDash([rx*.48,rx*.12,rx*.25,rx*.18]);
      cx.lineDashOffset=-q*rx*.20+e.seed*19;
      cx.ellipse(0,0,rx,ry,-.012,0,Math.PI*2);
      cx.strokeStyle='rgba(237,232,217,'+(life*__alpha*e.strength).toFixed(4)+')';
      cx.lineWidth=.72+life*.42;
      cx.shadowColor='rgba(235,229,211,'+(life*.06).toFixed(4)+')';
      cx.shadowBlur=2;cx.stroke();cx.restore();
    }
  }
  let enterTimer=0,cycleTimer=0;
  function schedule(stage=document.body.dataset.stage){
    clearTimeout(cycleTimer);
    if(!CONFIG[stage])return;
    const wait=stage==='landing'?4300+Math.random()*1500
      :stage==='draw'?13000+Math.random()*5000
      :(isPortrait()?5000+Math.random()*2200:8200+Math.random()*3400); /* v0.3.24 竖屏场景三度提频（5.0-7.2s） */
    cycleTimer=setTimeout(()=>{
      if(document.body.dataset.stage===stage)surge(stage);
      schedule(document.body.dataset.stage);
    },wait);
  }
  const stageObserver=new MutationObserver(()=>{
    clearTimeout(enterTimer);
    clearTimeout(cycleTimer);
    const stage=document.body.dataset.stage;
    events=[];
    if(CONFIG[stage]){
      enterTimer=setTimeout(()=>surge(stage),stage==='landing'?650:1900);
      schedule(stage);
    }
  });
  stageObserver.observe(document.body,{attributes:true,attributeFilter:['data-stage']});
  addEventListener('resize',sizeSceneRipple,{passive:true});
  window.__sjRippleSurge=surge; /* v0.3.23 供抽牌流程点水 */
  sizeSceneRipple();requestAnimationFrame(draw);enterTimer=setTimeout(()=>surge('landing'),700);schedule('landing');
})();
/* v0.3.13 场景页芦苇互动 D（阿晏）：不设透明大热区拦截页面，只从指针坐标判断苇丛范围。 */
(function(){
  const reeds=document.getElementById('sceneReedLayers');
  if(!reeds) return;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  let wasInside=false,gustTimer=0;
  function inReeds(e){
    if(reduced.matches||document.body.dataset.stage!=='scenes') return false;
    const portrait=matchMedia('(orientation:portrait)').matches;
    const rig=document.getElementById(portrait?'sceneReedPortraitTouch':'sceneReedRig');
    if(!rig) return false;
    const box=rig.getBoundingClientRect(),pad=Math.max(12,box.width*.045);
    return e.clientX>box.left-pad&&e.clientX<box.right+pad&&e.clientY>box.top-pad&&e.clientY<box.bottom+pad;
  }
  function gust(){
    if(reduced.matches) return;
    clearTimeout(gustTimer);
    reeds.classList.remove('is-gusting');
    void reeds.offsetWidth;
    reeds.classList.add('is-gusting');
    gustTimer=setTimeout(()=>reeds.classList.remove('is-gusting'),2350);
  }
  document.addEventListener('pointermove',e=>{
    const inside=inReeds(e);
    if(inside&&!wasInside) gust();
    wasInside=inside;
  },{passive:true});
  document.addEventListener('pointerdown',e=>{if(inReeds(e))gust();},{passive:true});
})();
</script>
</body>
